name: private-web-build
# Explicit build only. This personal mod does not publish to GitHub Pages.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6 and web templates
        run: |
          mkdir -p /tmp/godot ~/.local/share/godot/export_templates/4.6.stable
          curl --fail -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl --fail -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz 'templates/web*' -d /tmp/templates
          cp /tmp/templates/templates/web* ~/.local/share/godot/export_templates/4.6.stable/
      - name: Import, export, and package
        run: |
          GODOT=/tmp/godot/Godot_v4.6-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --import
          mkdir -p build/web
          "$GODOT" --headless --path . --export-release Web build/web/index.html
          python3 tools/package_web.py build/web build/site
      - uses: actions/upload-artifact@v4
        with:
          name: eunnei-web
          path: build/site
          retention-days: 7
